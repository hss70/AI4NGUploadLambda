AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AI4NG EEG Upload Lambda API (Presigned URL endpoint)

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - staging
      - prod
    Default: dev

  PrivateSubnetIds:
    Type: CommaDelimitedList
    Description: Private subnet IDs for Lambda VPC config

  PrivateSecurityGroupId:
    Type: String
    Description: Shared private security group ID

Resources:
  EEGUploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ai4ng-${Environment}-eeg-upload-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true

  EEGUploadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EEGUploadBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt EEGUploadBucket.Arn
              - !Sub ${EEGUploadBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

  UploadLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/ai4ng-${Environment}-upload
      RetentionInDays: 30

  AI4NGUploadLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: UploadBucketAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:AbortMultipartUpload
                Resource:
                  - !Sub ${EEGUploadBucket.Arn}/*
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !GetAtt EEGUploadBucket.Arn

  AI4NGUploadLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ai4ng-${Environment}-upload
      Runtime: dotnet8
      Handler: AI4NGUploadLambda::AI4NGUploadLambda.Function::FunctionHandler
      CodeUri: ../src/AI4NGUploadLambda/
      MemorySize: 512
      Timeout: 30
      Role: !GetAtt AI4NGUploadLambdaRole.Arn
      Environment:
        Variables:
          EEG_UPLOAD_BUCKET: !Ref EEGUploadBucket
          ENVIRONMENT: !Ref Environment
      VpcConfig:
        SecurityGroupIds:
          - !Ref PrivateSecurityGroupId
        SubnetIds: !Ref PrivateSubnetIds

  UploadIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Fn::ImportValue:
          Fn::Sub: AI4NG-${Environment}-SharedHttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AI4NGUploadLambda.Arn
      PayloadFormatVersion: "2.0"
      IntegrationMethod: POST

  UploadRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue:
          Fn::Sub: AI4NG-${Environment}-SharedHttpApiId
      RouteKey: GET /api/upload
      AuthorizationType: JWT
      AuthorizerId:
        Fn::ImportValue:
          Fn::Sub: AI4NG-${Environment}-ParticipantAuthorizerId
      Target: !Sub integrations/${UploadIntegration}

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AI4NGUploadLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub
        - arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*/*/api/upload
        - ApiId:
            Fn::ImportValue:
              Fn::Sub: AI4NG-${Environment}-SharedHttpApiId

Outputs:
  UploadApiPath:
    Description: Upload route path
    Value: !Sub /${Environment}/api/upload

  EEGUploadBucketName:
    Description: S3 bucket name for uploaded EEG/session files
    Value: !Ref EEGUploadBucket

  EEGUploadBucketArn:
    Description: S3 bucket ARN for uploaded EEG/session files
    Value: !GetAtt EEGUploadBucket.Arn

  UploadLambdaName:
    Description: Upload Lambda function name
    Value: !Ref AI4NGUploadLambda
