version: 0.2

phases:
  install:
    runtime-versions:
      dotnet: 8.0
    commands:
      - pip install aws-sam-cli

  build:
    commands:
      - sam build --template-file infra/template.yaml
      - sam package
        --template-file .aws-sam/build/template.yaml
        --s3-bucket ${ArtifactBucketName}
        --s3-prefix AI4NG-UploadLambda-${Environment}
        --output-template-file packaged.yaml

artifacts:
  files:
    - packaged.yaml
    - infra/parameters/${Environment}.json
